[project]
name = "estoque"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=25.1",
    "anthropic>=0.75",
    "itsdangerous>=2.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3", "pytest-asyncio>=1.0", "httpx>=0.28",
    "mypy>=1.14", "ruff>=0.14", "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/estoque"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 96
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "S"]
# N818 exige sufixo `Error` em excecao. O dominio deste projeto e' escrito em
# portugues por decisao — `ErroDominio` ja' carrega o prefixo equivalente, e
# `DominioError` seria pior que a regra que ele satisfaz.
# RUF001-003: o travessão (–) em "61–90 dias" é a pontuação correta para
# intervalo, e o texto aqui é visível ao usuário, em português. Trocar por
# hífen para agradar um lint pioraria a tipografia.
ignore = ["ANN401", "N818", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]
# Tabelas de fixture sao largas por natureza: quebrar cada linha em quatro
# esconderia o caso de teste que ela representa. S311: `random` semeado gera
# dados de demonstracao, nao segredo.
"src/estoque/data/seed/*" = ["E501", "S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
