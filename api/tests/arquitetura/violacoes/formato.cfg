[importlinter]
root_package = formato

[importlinter:contract:1]
name = exportacao da aplicacao nao conhece formato
type = forbidden
source_modules = formato.application.exportacao
forbidden_modules = formato.exportacao

[importlinter:contract:2]
name = assistente nao exporta
type = forbidden
source_modules = formato.assistant
forbidden_modules =
    formato.application.exportacao
    formato.exportacao
allow_indirect_imports = False
